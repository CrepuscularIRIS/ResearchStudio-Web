campaign:
  run_name: my-campaign
  repo_root: .
  metric: primary_metric_name
  metric_direction: maximize
  eval_cmd: "cd {cwd} && python scripts/arbor_eval.py --split dev --run-name {node_id}"
  eval_cmd_test: "cd {cwd} && python scripts/arbor_eval.py --split test --run-name {node_id}"
  protected_paths: ["scripts/arbor_eval.py", "configs/**"]
  gpu_h_ceiling: 100
  caps: {oracle_frac: 0.05, single_run_frac: 0.25, reserve_frac: 0.20}
  n_scientists: 2
  venue: TargetVenue
