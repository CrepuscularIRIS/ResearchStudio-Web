campaign:
  run_name: <short name>
  repo_root: <experiment repo, relative to the project root; must have a research-trunk branch>
  gpu_h_ceiling: 200
  kill_cap_gpu_h: 4
  caps: {oracle_frac: 0.05, single_run_frac: 0.25, reserve_frac: 0.2}
  protected_paths: ["<scoring script>", "<test split list>"]
  manuscripts: ["paper/main.tex"]
  manuscript_rules: paper/.claude/CLAUDE.md
  paper_sections: ["paper/sections/experiments.tex", "paper/sections/method.tex"]
